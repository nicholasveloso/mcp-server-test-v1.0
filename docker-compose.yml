version: "3.9"

services:
  tavily_mcp:
    build: ./tavily_mcp
    container_name: tavily_mcp
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8701:8000"
    volumes:
      - ./secrets:/app/secrets:ro
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  pg_mcp:
    build: ./pg_mcp
    container_name: pg_mcp
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8702:8000"
    volumes:
      - ./secrets:/app/secrets:ro
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

# To run in debug with .env.debug: docker compose --env-file .env.debug up --build